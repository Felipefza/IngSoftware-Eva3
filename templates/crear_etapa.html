{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editor de Etapas</title>

        <!-- BOOTSTRAP v5.3 -->
        <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
        <script src="{% static 'js/bootstrap.js' %}"></script>

        <!-- BOOTSTRAP ICONS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

        <!-- INICIO CSS -->
        <link rel="stylesheet" href="{% static 'css/inicio.css' %}">

        <script>
        cancelar = () => {
          window.location.href = "{% url 'editor_etapas_page' %}"
        }
        </script>
    </head>
    <body class="position-relative" style="background-color: #ffe0a5; min-height: 100vh; min-width: 100vw; overflow-x: hidden;">

        <!-- Barra de navegación compartida -->
        {% include 'navegacion.html' %}

        <!-- Título principal -->
        <div class="d-flex flex-column fw-bold justify-content-center w-100 text-center my-4">
            <div class="container">
                <p class="text-break mb-0" style="color: #673117; font-size: 4.5rem; letter-spacing: 2px;">EDITOR DE</p>
                <p class="text-center" style="font-size: 4.5rem; letter-spacing: 2px;">ETAPAS</p>
            </div>
        </div>
        <main class="container d-flex flex-column align-items-center p-5 rounded" style="max-width: 30rem; background-color: #673117;">
            <form method="post" action="{% url 'crear_etapa_page' %}" class="w-100">
                {% csrf_token %}
                <label for="numero_etapa" class="text-white">Numero de Etapa</label>
                <input id="numero_etapa" class="form-control mb-3" name="numero_etapa">

                <label for="titulo_estado" class="text-white">Titulo</label>
                <input id="titulo_estado" class="form-control mb-3" name="titulo_estado">

                <label for="descipcion_estado" class="text-white">Descripcion</label>
                <input id="descripcion_estado" class="form-control mb-3" name="descripcion_estado"">

                <button type="submit" class="btn btn-success">Confirmar</button>
                <button type="button" class="btn btn-danger" onClick="cancelar()">Cancelar</button>
            </form>
        </main>
    </body>
</html>
