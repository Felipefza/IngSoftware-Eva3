{% load static %}

<!DOCTYPE html>

<html lang="es">
    <head>
    	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Inicio</title>

        <!-- BOOTSTRAP v5.3 -->
        <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
        <script src="{% static 'js/bootstrap.js' %}"></script>

        <!-- BOOTSTRAP ICONS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">


        <!-- INICIO CSS -->
        <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
    </head>
    <body class="position-relative" style="background-color: #ffe0a5; height: 100vh; width: 100vw; overflow-x: hidden;">
        <!-- 
            <div class="position-absolute" style="background-color: #673117; width: 60px; height: 300vh; rotate: -50deg;"></div>
        -->

        {% include 'navegacion.html' %}

        <main class="container d-flex mt-3 w-100 d-flex flex-column" style="max-width: 30rem;">
            <form method="post" action="/login/">
                {% csrf_token %}

                <h1 class="text-center mt-5 mb-5">Inicio de sesion</h1>

                <div class="p-5 rounded-3" style="background-color: #673117;">
                    <label for="username" class="form-label text-light">Nombre de usuario</label>
                    <input  id="username" class="form-control mb-3" type="text" name="username" required>

                    <label for="password" class="form-label text-light">Contraseña</label>
                    <input  id="password" class="form-control" type="password" name="password" required>


                    <div class="d-flex justify-content-end mt-5">
                        <button class="btn btn-success mx-2" type="submit">Confirmar</button>
                        <button class="btn btn-danger"  type="submit">Salir</button>
                    </div>
                </div>

            </form>
        </main>
    </body>

</html>
