{% load static %}

<!DOCTYPE html>

<html lang="es">
    <head>
    	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Inicio</title>

        <!-- BOOTSTRAP v5.3 -->
        <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
        <script src="{% static 'js/bootstrap.js' %}"></script>


        <!-- BOOTSTRAP ICONS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">


        <!-- INICIO CSS -->
        <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
    </head>
    <body class="position-relative" style="background-color: #ffe0a5; height: 100vh; width: 100vw; overflow-x: hidden;">
        <!--
            <div class="position-absolute" style="background-color: #673117; width: 60px; height: 300vh; rotate: -50deg;"></div>
        -->

        {% include 'navegacion.html' %}

        <div class="d-flex flex-column fw-bold justify-content-center w-100 text-center">
            <div class="container">
                <p class="text-break" style="color: #673117; font-size: 6rem;">CAMBIO DE</p>
                <p class="text-center" style="font-size: 6rem;">ETAPAS</p>
            </div>
        </div>

        <main class="container d-flex mt-3 w-100 text-center">
            <div class="container rounded-4" style="background-color: #e9b87e; max-width: 30rem; max-height: 30rem;">
                <p class="fs-1 mt-4">
                    {{ estado_activo.titulo_estado }}
                </p>

                <div class="container w-100  position-relative" style="min-height: 12rem;">
                    <img class="position-absolute top-50 start-50 translate-middle img-fluid object-fit-contain"
                        src="{% static 'img/pentagono.png' %}" alt="Logo"
                        style="max-width: 30rem; width: 100%; height: 10rem;"
                    >
                    <p class="fs-2 position-absolute top-50 start-50 translate-middle"
                        style="color: #673117; max-width: 30rem; width: 100%;">
                        {{ estado_activo.descripcion_estado }}
                    </p>
                </div>
            </div>
        </main>
    </body>

</html>
