{% load static %}

<!DOCTYPE html>

<html lang="es">
    <head>
    	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Inicio</title>

        <!-- BOOTSTRAP -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- BOOTSTRAP ICONS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">


        <!-- INICIO CSS -->
        <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
    </head>
    <body class="position-relative" style="background-color: #ffe0a5; height: 100vh; width: 100vw; overflow-y: hidden; overflow-x: hidden;">
        <div class="position-absolute" style="background-color: #673117; width: 80rem; height: 300vh; rotate: -50deg;"></div>

        {% include 'navegacion.html' %}

        <main class="container d-flex mt-5 w-100">
            <div class="position-relative w-100">
                <img id="cesta-pan" class="position-absolute bottom-0" src="{% static 'img/cesta_pan.png' %}" alt="Logo" style="max-height: 25rem;">
            </div>

            <div class="d-flex flex-column fw-bold justify-content-center w-100 text-center">
                <div class="container">
                    <p class="text-break" style="color: #673117; font-size: 6rem;">PANADERÍA</p>
                    <p class="text-center" style="font-size: 6rem;">DON JORGE</p>
                </div>

                <div id="etapa" class="container d-flex flex-column pt-3 pb-3 ps-5 pe-5 rounded-4 text-center mt-5" style="background-color: #e9b87e; width: 30rem;">
                    <p style="font-size: 3rem;">Etapa de la</p>
                    <p style="font-size: 3rem;">preparación</p>

                    <div class="container w-100  position-relative" style="height: 6rem;">
                        <img class="position-absolute top-50 start-50 translate-middle img-fluid object-fit-contain"
                            src="{% static 'img/pentagono.png' %}" alt="Logo"
                            style="max-width: 30rem; width: 100%; height: 10rem;"
                        >

                        <p class="fs-2 position-absolute top-50 start-50 translate-middle"
                            style="color: #673117; max-width: 30rem; width: 100%;">{{ estado_activo.descripcion_estado }}
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </body>

</html>
